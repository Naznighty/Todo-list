<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simple To-Do List - Manage your tasks with ease"
    />
    <title>Simple To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1 class="app-title">To-Do</h1>
        <p class="app-subtitle">Organize your tasks, stay productive.</p>
      </header>

      <section class="add-todo-section">
        <form id="todoForm" class="todo-form">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="Add a new task..."
            autocomplete="off"
            maxlength="150"
            aria-label="Add a new task"
          />
          <button type="submit" class="btn btn-add" aria-label="Add task">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add</span>
          </button>
        </form>
      </section>

      <section class="filters-section">
        <div class="filter-buttons" role="tablist" aria-label="Task filters">
          <button
            class="filter-btn active"
            data-filter="all"
            role="tab"
            aria-selected="true"
          >
            All
          </button>
          <button
            class="filter-btn"
            data-filter="active"
            role="tab"
            aria-selected="false"
          >
            Active
          </button>
          <button
            class="filter-btn"
            data-filter="completed"
            role="tab"
            aria-selected="false"
          >
            Completed
          </button>
        </div>
        <div class="todo-stats">
          <span id="todoCount" class="todo-count">0 tasks</span>
        </div>
      </section>

      <section class="todo-list-section">
        <ul id="todoList" class="todo-list" aria-label="Task list"></ul>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              ></path>
              <path d="M9 14l2 2 4-4"></path>
            </svg>
          </div>
          <p class="empty-text">No tasks yet</p>
          <p class="empty-hint">
            Type in the field above to add your first task
          </p>
        </div>
      </section>

      <footer class="app-footer">
        <button
          id="clearCompleted"
          class="btn btn-clear"
          aria-label="Clear completed tasks"
        >
          Clear Completed
        </button>
      </footer>
    </div>

    <script src="JS/script.js"></script>
  </body>
</html>
